# nginx server block for the gateway. Put it in /etc/nginx/conf.d/ (or
# sites-available/ and link it), change the server_name, certificate paths and
# upstream address, then `nginx -t && nginx -s reload`.
#
# Upstream: 127.0.0.1:8080 when nginx runs on the same machine as the Compose
# deployment; the service name (gateway:8080, or <stack>_mtg-assistant-gateway:8080 on
# Swarm) when nginx is a container on the same Docker network.

server {
    listen 80;
    listen [::]:80;
    server_name mtg.example.com;
    # certbot --webroot -w /var/www/certbot answers its challenges from here.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.25.1 and newer prefer "listen 443 ssl;" plus "http2 on;"; this
    # older form works everywhere and only logs a warning there.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mtg.example.com;

    ssl_certificate     /etc/letsencrypt/live/mtg.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mtg.example.com/privkey.pem;

    # Saved card-scan sessions are JSON up to 2 MB; nginx's default is 1 MB.
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # The gateway checks the Host header against MTG_PUBLIC_URL.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Don't hold back responses, and give long research calls time.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
