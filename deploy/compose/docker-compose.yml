# MTG Assistant Gateway: plain Docker Compose (one machine, no Swarm).
# Walkthrough: docs/DEPLOY-COMPOSE.md. In short:
#   cp .env.example .env   # fill in the REQUIRED lines
#   ./make-secrets.sh      # the secrets, as files in ./secrets/
#   docker compose up -d
# Behind a proxy container instead of one on this machine: docs/REVERSE-PROXY.md.

name: mtg-gateway

secrets:
  mtg_fernet_key:
    file: ./secrets/mtg_fernet_key.txt
  mtg_session_secret:
    file: ./secrets/mtg_session_secret.txt
  mtg_oidc_client_secret:
    file: ./secrets/mtg_oidc_client_secret.txt
  # Authentik API token for the removed-member clean-up, or the word off.
  mtg_authentik_api_token:
    file: ./secrets/mtg_authentik_api_token.txt
  # The gateway's token for this stack's own ntfy server.
  mtg_ntfy_token:
    file: ./secrets/mtg_ntfy_token.txt

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gateway:
    image: ghcr.io/theuncleben/mtg-assistant-gateway:${MTG_TAG:-latest}
    # Lets running requests and a deck apply finish before a restart stops it.
    stop_grace_period: 200s
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    secrets:
      - mtg_fernet_key
      - mtg_session_secret
      - mtg_oidc_client_secret
      - mtg_authentik_api_token
      - mtg_ntfy_token
    environment:
      MTG_PUBLIC_URL: ${MTG_PUBLIC_URL:?PUBLIC HTTPS URL REQUIRED e.g. https://mtg.example.com}
      MTG_OIDC_ISSUER: ${MTG_OIDC_ISSUER:?OIDC ISSUER URL REQUIRED}
      MTG_OIDC_CLIENT_ID: ${MTG_OIDC_CLIENT_ID:?OIDC CLIENT ID REQUIRED}
      MTG_REQUIRED_GROUP: ${MTG_REQUIRED_GROUP:-}
      MTG_ALLOW_ANY_IDP_USER: ${MTG_ALLOW_ANY_IDP_USER:-false}
      MTG_ADMIN_GROUP: ${MTG_ADMIN_GROUP:-}
      MTG_OIDC_GROUPS_CLAIM: ${MTG_OIDC_GROUPS_CLAIM:-}
      MTG_OIDC_SCOPES: ${MTG_OIDC_SCOPES:-openid profile email offline_access}
      MTG_OIDC_TOKEN_AUTH_METHOD: ${MTG_OIDC_TOKEN_AUTH_METHOD:-}
      MTG_OIDC_PREVIOUS_ISSUERS: ${MTG_OIDC_PREVIOUS_ISSUERS:-}
      MTG_WRITES_ENABLED: ${MTG_WRITES_ENABLED:-true}
      MTG_WATCHLISTS_ENABLED: ${MTG_WATCHLISTS_ENABLED:-}
      MTG_ARCHIDEKT_BACKUPS: ${MTG_ARCHIDEKT_BACKUPS:-}
      MTG_APPLY_IN_CHAT: ${MTG_APPLY_IN_CHAT:-}
      MTG_SCAN_ART_ENABLED: ${MTG_SCAN_ART_ENABLED:-}
      MTG_UPDATE_CHECK: ${MTG_UPDATE_CHECK:-}
      MTG_DECK_SYNC_MINUTES: ${MTG_DECK_SYNC_MINUTES:-}
      MTG_TRUSTED_PROXIES: ${MTG_TRUSTED_PROXIES:-}
      MTG_CIMD_ENABLED: ${MTG_CIMD_ENABLED:-true}
      MTG_CIMD_ALLOWED_HOSTS: ${MTG_CIMD_ALLOWED_HOSTS:-}
      MTG_ACCESS_TOKEN_TTL: ${MTG_ACCESS_TOKEN_TTL:-3600}
      MTG_REFRESH_TOKEN_TTL: ${MTG_REFRESH_TOKEN_TTL:-2592000}
      MTG_BROWSER_SESSION_TTL: ${MTG_BROWSER_SESSION_TTL:-604800}
      MTG_REAUTH_INTERVAL: ${MTG_REAUTH_INTERVAL:-604800}
      MTG_MEMBERSHIP_CHECK_TTL: ${MTG_MEMBERSHIP_CHECK_TTL:-5}
      # Fixed: secrets, the stack's own services, the backup copy folder (mounted below)
      # and Forge on or off (FORGE_REPLICAS).
      MTG_OIDC_CLIENT_SECRET_FILE: /run/secrets/mtg_oidc_client_secret
      MTG_FERNET_KEY_FILE: /run/secrets/mtg_fernet_key
      MTG_SESSION_SECRET_FILE: /run/secrets/mtg_session_secret
      MTG_AUTHENTIK_API_TOKEN_FILE: /run/secrets/mtg_authentik_api_token
      MTG_NTFY_TOKEN_FILE: /run/secrets/mtg_ntfy_token
      MTG_NTFY_URL: http://ntfy:8080
      MTG_MYSTIC_FORGE_URL: http://mysticforge:8000/mcp
      MTG_FORGE_URL: http://forge:8000
      MTG_FORGE_REPLICAS: ${FORGE_REPLICAS:-1}
      MTG_BACKUP_COPY_DIR: /backup-copy
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TIMEZONE:-UTC}
    ports:
      # Only this machine can reach it; your reverse proxy adds https in front.
      - "${MTG_HTTP_BIND:-127.0.0.1}:${MTG_HTTP_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${MTG_DATA_DIR:-./data}
        target: /data
      - type: bind
        source: ${MTG_BACKUP_DIR:-./backups}
        target: /backups
      # Empty MTG_BACKUP_COPY_DIR mounts /dev/null: no copies.
      - type: bind
        source: ${MTG_BACKUP_COPY_DIR:-/dev/null}
        target: /backup-copy
    networks:
      - mtg
      - mysticforge
      - forge
      - ntfy
    # Least privilege: root only to match PUID/PGID, then it drops to that user.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    depends_on:
      mysticforge:
        condition: service_started
      ntfy:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: ${MTG_MEMORY_LIMIT:-256M}
          pids: 512

  # Mystic Forge: the research service. Only the gateway can reach it.
  mysticforge:
    image: ghcr.io/theuncleben/mtg-assistant-mysticforge:1.3.2-mag6
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=8)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      MYSTIC_FORGE_NO_INGEST: "1"
      MYSTIC_FORGE_NTFY_OFF: "1"
      MYSTIC_FORGE_PUBLIC_BASE: http://mysticforge:8000
      MYSTIC_FORGE_DB: /data/mystic_forge.db
      MYSTIC_FORGE_CR: /data/cr_cache.txt
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TIMEZONE:-UTC}
    networks:
      - mysticforge
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 512

  # ntfy: holds members' phone notifications. Only the gateway can reach it.
  ntfy:
    image: binwiederhier/ntfy:v2.31.1@sha256:91bb7fa607b02006c119bb4a31032923b414a713a032ecb40f0c5d6bfd5b7e40
    restart: unless-stopped
    logging: *logging
    # Makes the gateway's only user from the secret at each start. "$$" is "$" for the shell.
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        pw=$$(head -c 32 /dev/urandom | base64)
        hash=$$(printf '%s\n%s\n' "$$pw" "$$pw" | ntfy user hash 2>/dev/null | tr ' ' '\n' | grep '^\$$2')
        NTFY_AUTH_USERS="mtg-gateway:$$hash:user"
        NTFY_AUTH_TOKENS="mtg-gateway:$$(cat /run/secrets/mtg_ntfy_token):gateway"
        export NTFY_AUTH_USERS NTFY_AUTH_TOKENS
        unset pw hash
        exec ntfy serve
    environment:
      NTFY_LISTEN_HTTP: ":8080"
      NTFY_AUTH_FILE: /tmp/ntfy-auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_AUTH_ACCESS: "mtg-gateway:mtg-*:rw"
      NTFY_WEB_ROOT: disable
      NTFY_CACHE_DURATION: 12h
      # All phones reach ntfy through the gateway, so it counts as one visitor.
      NTFY_VISITOR_SUBSCRIPTION_LIMIT: "250"
      NTFY_VISITOR_REQUEST_LIMIT_BURST: "600"
      NTFY_VISITOR_REQUEST_LIMIT_REPLENISH: "1s"
      TZ: ${TIMEZONE:-UTC}
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/v1/health
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    secrets:
      - mtg_ntfy_token
    user: "${PUID:-1000}:${PGID:-1000}"
    networks:
      - ntfy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
          pids: 128

  # Forge: the rules engine for simulations (GPL-3.0). FORGE_REPLICAS=0 turns it off.
  # No internet; Java runs only during a simulation, inside the limits below.
  forge:
    image: ghcr.io/theuncleben/mtg-assistant-forge:2.0.15-mag6
    restart: unless-stopped
    logging: *logging
    environment:
      # Sizes games at once where Docker can't cap memory (Raspberry Pi OS).
      FORGE_MEMORY_BUDGET: ${FORGE_MEMORY_LIMIT:-1536M}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TIMEZONE:-UTC}
    networks:
      - forge
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    deploy:
      replicas: ${FORGE_REPLICAS:-1}
      resources:
        limits:
          memory: ${FORGE_MEMORY_LIMIT:-1536M}
          cpus: "${FORGE_CPUS:-2}"
          pids: 512

networks:
  # A proxy container joins this one.
  mtg:
    name: ${MTG_NETWORK_NAME:-mtg-gateway}
  # Private: only the gateway and that service. Mystic Forge needs the internet; the others don't.
  mysticforge:
  forge:
    internal: true
  ntfy:
    internal: true
