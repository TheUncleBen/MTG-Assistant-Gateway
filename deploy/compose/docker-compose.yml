# MTG Assistant Gateway: plain Docker Compose (one machine, no Swarm).
#
# Same services as deploy/portainer-stack.yml, for people who don't run a
# Swarm. Walkthrough: docs/DEPLOY-COMPOSE.md. In short:
#
#   cp .env.example .env              # then edit the REQUIRED lines
#   ./make-secrets.sh                 # or create ./secrets/*.txt by hand
#   docker compose up -d
#
# Everything you change lives in .env. Secrets are files in ./secrets/, mounted
# at /run/secrets/ exactly like Swarm secrets, never environment variables.
#
# The gateway listens on 127.0.0.1:${MTG_HTTP_PORT:-8080} on this machine for a
# reverse proxy that runs here too. To put a proxy container in front instead,
# see docs/REVERSE-PROXY.md (deploy/proxy/ has ready-made overrides).

name: ${COMPOSE_PROJECT_NAME:-mtg-gateway}

secrets:
  mtg_fernet_key:
    file: ${MTG_SECRETS_DIR:-./secrets}/mtg_fernet_key.txt
  mtg_session_secret:
    file: ${MTG_SECRETS_DIR:-./secrets}/mtg_session_secret.txt
  mtg_oidc_client_secret:
    file: ${MTG_SECRETS_DIR:-./secrets}/mtg_oidc_client_secret.txt
  # The Authentik API token for the hourly removed-member clean-up (docs/IDP-AUTHENTIK.md,
  # "Optional: removed-member clean-up"), or the word off, which make-secrets.sh writes.
  mtg_authentik_api_token:
    file: ${MTG_SECRETS_DIR:-./secrets}/mtg_authentik_api_token.txt
  # The token the gateway uses with this stack's own ntfy server (the members' notifications);
  # make-secrets.sh creates it.
  mtg_ntfy_token:
    file: ${MTG_SECRETS_DIR:-./secrets}/mtg_ntfy_token.txt

services:
  # The gateway: OAuth server for AI clients, MCP endpoint and browser pages.
  gateway:
    image: ${MTG_IMAGE:-ghcr.io/theuncleben/mtg-assistant-gateway}:${MTG_TAG:-latest}
    # A redeploy lets requests already running finish (up to 100 s), then a running deck apply
    # (up to 90 s more), before Docker kills the container; the default is 10 s.
    stop_grace_period: 200s
    restart: unless-stopped
    # Docker keeps container logs forever by default (json-file max-size -1); cap them so a
    # small disk (a Raspberry Pi SD card) can't fill up.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    secrets:
      - mtg_fernet_key
      - mtg_session_secret
      - mtg_oidc_client_secret
      - mtg_authentik_api_token
      - mtg_ntfy_token
    # Most settings passed as ${MTG_X:-} (empty unless your env sets it) are also on the gateway's
    # Settings page (/admin/settings), which starts from the gateway's default; .env.example says
    # which. A value set in your env wins and locks it: the page shows it greyed out with its
    # value.
    environment:
      MTG_PUBLIC_URL: ${MTG_PUBLIC_URL:?PUBLIC HTTPS URL REQUIRED e.g. https://mtg.example.com}
      MTG_OIDC_ISSUER: ${MTG_OIDC_ISSUER:?OIDC ISSUER URL REQUIRED}
      MTG_OIDC_CLIENT_ID: ${MTG_OIDC_CLIENT_ID:?OIDC CLIENT ID REQUIRED}
      MTG_OIDC_CLIENT_SECRET_FILE: /run/secrets/mtg_oidc_client_secret
      MTG_FERNET_KEY_FILE: /run/secrets/mtg_fernet_key
      MTG_SESSION_SECRET_FILE: /run/secrets/mtg_session_secret
      MTG_OIDC_SCOPES: ${MTG_OIDC_SCOPES:-openid profile email offline_access}
      MTG_REQUIRED_GROUP: ${MTG_REQUIRED_GROUP:-}
      MTG_ALLOW_ANY_IDP_USER: ${MTG_ALLOW_ANY_IDP_USER:-false}
      # Optional. Empty values fall back to the gateway's defaults (docs/DEPLOY.md, environment reference).
      MTG_ADMIN_GROUP: ${MTG_ADMIN_GROUP:-}
      MTG_OIDC_GROUPS_CLAIM: ${MTG_OIDC_GROUPS_CLAIM:-}
      MTG_OIDC_PREVIOUS_ISSUERS: ${MTG_OIDC_PREVIOUS_ISSUERS:-}
      MTG_OIDC_TOKEN_AUTH_METHOD: ${MTG_OIDC_TOKEN_AUTH_METHOD:-}
      MTG_SERVER_NAME: ${MTG_SERVER_NAME:-}
      MTG_CHATGPT_NAME: ${MTG_CHATGPT_NAME:-}
      # The removed-member clean-up reads its token from the secret above; the word off there
      # turns it off. The API URL defaults to the issuer's address.
      MTG_AUTHENTIK_API_TOKEN_FILE: ${MTG_AUTHENTIK_API_TOKEN_FILE:-/run/secrets/mtg_authentik_api_token}
      MTG_AUTHENTIK_API_URL: ${MTG_AUTHENTIK_API_URL:-}
      # Notifications to the members' Android app go through this stack's own ntfy server
      # (the ntfy service below); the phones reach it through the gateway's own address.
      MTG_NTFY_URL: ${MTG_NTFY_URL:-http://ntfy:8080}
      MTG_NTFY_TOKEN_FILE: ${MTG_NTFY_TOKEN_FILE:-/run/secrets/mtg_ntfy_token}
      # Watchlists and prices, off by default: with false the Watchlist pages, the price buttons,
      # the five watch tools and the daily price check are absent (stored watches are kept).
      MTG_WATCHLISTS_ENABLED: ${MTG_WATCHLISTS_ENABLED:-}
      # Deck sync (read-only): minutes between checks of Archidekt for members with waiting
      # proposals; opening the app checks too. 0 turns it off.
      MTG_DECK_SYNC_MINUTES: ${MTG_DECK_SYNC_MINUTES:-}
      # Watchlists: cards and decks per member, days of daily prices kept, and the hour (UTC) of
      # the daily price check. Nothing is asked of Scryfall while nobody watches anything.
      MTG_WATCH_MAX_CARDS: ${MTG_WATCH_MAX_CARDS:-}
      MTG_WATCH_MAX_DECKS: ${MTG_WATCH_MAX_DECKS:-}
      MTG_PRICE_HISTORY_DAYS: ${MTG_PRICE_HISTORY_DAYS:-}
      MTG_PRICE_HOUR_UTC: ${MTG_PRICE_HOUR_UTC:-}
      MTG_DATA_DIR: /data
      MTG_BACKUP_DIR: /backups
      # Copies every backup here too; off unless MTG_BACKUP_COPY_DIR names a host folder (below).
      MTG_BACKUP_COPY_DIR: /backup-copy
      MTG_BACKUP_HOUR_UTC: ${MTG_BACKUP_HOUR_UTC:-}
      MTG_BACKUP_KEEP_DAYS: ${MTG_BACKUP_KEEP_DAYS:-}
      MTG_LOG_LEVEL: ${MTG_LOG_LEVEL:-}
      # Set to an empty value (and drop the mysticforge service) to run without research tools.
      MTG_MYSTIC_FORGE_URL: ${MTG_MYSTIC_FORGE_URL-http://mysticforge:8000/mcp}
      # Forge simulations: on by default with the forge profile; an empty value turns them off.
      MTG_FORGE_URL: ${MTG_FORGE_URL-http://forge:8000}
      MTG_FORGE_GAMES: ${MTG_FORGE_GAMES:-}
      # Forge games the gateway asks Forge to play at once for one report (1 to 16); FORGE_MAX_PARALLEL
      # on the Forge service caps all runs together.
      MTG_FORGE_PARALLEL_GAMES: ${MTG_FORGE_PARALLEL_GAMES:-}
      MTG_WRITES_ENABLED: ${MTG_WRITES_ENABLED:-false}
      MTG_APPROVAL_MODE_DEFAULT: ${MTG_APPROVAL_MODE_DEFAULT:-}
      MTG_APPROVAL_MODE_MAX: ${MTG_APPROVAL_MODE_MAX:-}
      MTG_AUTO_APPLY_MAX_ROWS: ${MTG_AUTO_APPLY_MAX_ROWS:-}
      # In auto mode, an edit with more card rows than this waits for the member; days a waiting
      # change stays open.
      MTG_AUTO_BIG_EDIT_ROWS: ${MTG_AUTO_BIG_EDIT_ROWS:-}
      MTG_PROPOSAL_EXPIRY_DAYS: ${MTG_PROPOSAL_EXPIRY_DAYS:-}
      MTG_APPLY_IN_CHAT: ${MTG_APPLY_IN_CHAT:-}
      MTG_UPDATE_CHECK: ${MTG_UPDATE_CHECK:-}
      MTG_ARCHIDEKT_BACKUPS: ${MTG_ARCHIDEKT_BACKUPS:-}
      MTG_ARCHIDEKT_BACKUP_FOLDER: ${MTG_ARCHIDEKT_BACKUP_FOLDER:-MTG Gateway backups}
      # Backup copies kept per deck on Archidekt, whether the editor's backup box starts ticked,
      # and restore points kept per deck on the gateway.
      MTG_ARCHIDEKT_BACKUP_COPIES: ${MTG_ARCHIDEKT_BACKUP_COPIES:-}
      MTG_ARCHIDEKT_BACKUP_BOX_DEFAULT: ${MTG_ARCHIDEKT_BACKUP_BOX_DEFAULT:-}
      MTG_SNAPSHOTS_PER_DECK: ${MTG_SNAPSHOTS_PER_DECK:-}
      MTG_ACCESS_TOKEN_TTL: ${MTG_ACCESS_TOKEN_TTL:-3600}
      MTG_REFRESH_TOKEN_TTL: ${MTG_REFRESH_TOKEN_TTL:-2592000}
      MTG_BROWSER_SESSION_TTL: ${MTG_BROWSER_SESSION_TTL:-7200}
      MTG_REAUTH_INTERVAL: ${MTG_REAUTH_INTERVAL:-604800}
      MTG_MEMBERSHIP_CHECK_TTL: ${MTG_MEMBERSHIP_CHECK_TTL:-5}
      MTG_ARCHIDEKT_CALLS_PER_10_MIN: ${MTG_ARCHIDEKT_CALLS_PER_10_MIN:-}
      MTG_ARCHIDEKT_MAX_PER_MINUTE: ${MTG_ARCHIDEKT_MAX_PER_MINUTE:-}
      MTG_ARCHIDEKT_MIN_INTERVAL: ${MTG_ARCHIDEKT_MIN_INTERVAL:-}
      MTG_ARCHIDEKT_RETRIES: ${MTG_ARCHIDEKT_RETRIES:-}
      MTG_ARCHIDEKT_BACKOFF_BASE: ${MTG_ARCHIDEKT_BACKOFF_BASE:-}
      MTG_ARCHIDEKT_CACHE_SECONDS: ${MTG_ARCHIDEKT_CACHE_SECONDS:-}
      MTG_ARCHIDEKT_CARD_CACHE_SECONDS: ${MTG_ARCHIDEKT_CARD_CACHE_SECONDS:-}
      MTG_TRUSTED_PROXIES: ${MTG_TRUSTED_PROXIES:-}
      # Host headers /mcp accepts. Empty = the host in MTG_PUBLIC_URL.
      MTG_ALLOWED_HOSTS: ${MTG_ALLOWED_HOSTS:-}
      MTG_CIMD_ENABLED: ${MTG_CIMD_ENABLED:-true}
      MTG_CIMD_ALLOWED_HOSTS: ${MTG_CIMD_ALLOWED_HOSTS:-}
      # Only for an Android app you build yourself (docs/ANDROID.md): its package ID, and the App
      # Links statement list served at /.well-known/assetlinks.json (one JSON list; empty = none).
      MTG_ANDROID_PACKAGE: ${MTG_ANDROID_PACKAGE:-local.mtgassistantgateway.app}
      MTG_ANDROID_ASSETLINKS: ${MTG_ANDROID_ASSETLINKS:-}
      # Only with a folder you mount yourself (docs/OPERATIONS.md, docs/ANDROID.md): your own copy
      # of the assistant plugin, or of the Android app. Empty = the copies in the image.
      MTG_PLUGIN_DIR: ${MTG_PLUGIN_DIR:-}
      MTG_APP_DIR: ${MTG_APP_DIR:-}
      MTG_SCRYFALL_LOOKUP_INTERVAL: ${MTG_SCRYFALL_LOOKUP_INTERVAL:-}
      # Archidekt API base. Leave the default (only the end-to-end tests change it, with the Swarm stack file).
      MTG_ARCHIDEKT_BASE: ${MTG_ARCHIDEKT_BASE:-https://archidekt.com/api}
      # Card scanning: name matching, reading and glare thresholds, and the artwork check
      # (docs/SCANNING.md). A change applies after the gateway restarts.
      MTG_SCAN_FUZZY_MIN_SIMILARITY: ${MTG_SCAN_FUZZY_MIN_SIMILARITY:-}
      MTG_SCAN_FUZZY_CONFIDENT_SIMILARITY: ${MTG_SCAN_FUZZY_CONFIDENT_SIMILARITY:-}
      MTG_SCAN_AMBIGUITY_MARGIN: ${MTG_SCAN_AMBIGUITY_MARGIN:-}
      MTG_SCAN_AUTO_ADD_CONFIDENCE: ${MTG_SCAN_AUTO_ADD_CONFIDENCE:-}
      MTG_SCAN_FOIL_STAR_INK_RATIO: ${MTG_SCAN_FOIL_STAR_INK_RATIO:-}
      MTG_SCAN_GLARE_RATIO: ${MTG_SCAN_GLARE_RATIO:-}
      MTG_SCAN_MIN_OCR_CONFIDENCE: ${MTG_SCAN_MIN_OCR_CONFIDENCE:-}
      MTG_SCAN_ART_ENABLED: ${MTG_SCAN_ART_ENABLED:-}
      MTG_SCAN_ART_MAX_DISTANCE: ${MTG_SCAN_ART_MAX_DISTANCE:-}
      MTG_SCAN_ART_MIN_MARGIN: ${MTG_SCAN_ART_MIN_MARGIN:-}
      MTG_SCAN_ART_MAX_PRINTINGS: ${MTG_SCAN_ART_MAX_PRINTINGS:-}
      MTG_SCAN_ART_IMAGE_INTERVAL: ${MTG_SCAN_ART_IMAGE_INTERVAL:-}
      MTG_SCAN_ART_IMAGES_PER_HOUR: ${MTG_SCAN_ART_IMAGES_PER_HOUR:-}
      MTG_SCAN_ART_MAX_GALLERIES: ${MTG_SCAN_ART_MAX_GALLERIES:-}
      MTG_SCAN_ART_GALLERY_IDLE_DAYS: ${MTG_SCAN_ART_GALLERY_IDLE_DAYS:-}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TIMEZONE:-UTC}
    ports:
      # Only this machine can reach it; your reverse proxy adds HTTPS in front.
      - "${MTG_HTTP_BIND:-127.0.0.1}:${MTG_HTTP_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${MTG_DATA_DIR:-./data}
        target: /data
      - type: bind
        source: ${MTG_BACKUP_DIR:-./backups}
        target: /backups
      # Optional second backup folder, for example shared storage every node mounts. Left
      # blank, /dev/null is mounted instead and the gateway makes no copies.
      - type: bind
        source: ${MTG_BACKUP_COPY_DIR:-/dev/null}
        target: /backup-copy
    networks:
      - mtg
      - mysticforge
      - forge
      - ntfy
    # Least privilege: the entrypoint starts as root only to match PUID/PGID, then drops to
    # that user with setpriv --no-new-privs; these four capabilities are all it needs.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    depends_on:
      mysticforge:
        condition: service_started
      ntfy:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: ${MTG_MEMORY_LIMIT:-256M}
          # A cap on processes and threads, so a runaway or compromised process can't
          # fork-bomb the machine. The gateway normally runs a few dozen threads.
          pids: 512

  # Mystic Forge: internal research and simulation service. No published ports;
  # only the gateway talks to it.
  mysticforge:
    image: ${MF_IMAGE:-ghcr.io/theuncleben/mtg-assistant-mysticforge}:${MF_TAG:-1.3.2-mag6}
    restart: unless-stopped
    # Docker keeps container logs forever by default (json-file max-size -1); cap them so a
    # small disk (a Raspberry Pi SD card) can't fill up.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=8)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      # Fixed on purpose: no MTGJSON price download and no ntfy.sh pushes.
      MYSTIC_FORGE_NO_INGEST: "1"
      MYSTIC_FORGE_NTFY_OFF: "1"
      # Base URL Mystic Forge prints in links. Its own default is the upstream
      # author's public site, so always set it.
      MYSTIC_FORGE_PUBLIC_BASE: ${MF_PUBLIC_BASE:-http://mysticforge:8000}
      MYSTIC_FORGE_DB: /data/mystic_forge.db
      MYSTIC_FORGE_CR: /data/cr_cache.txt
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TIMEZONE:-UTC}
    # Only on its own network with the gateway: a proxy container on "mtg" can't reach it.
    networks:
      - mysticforge
    # Least privilege: the entrypoint starts as root only to match PUID/PGID, then drops to
    # that user with setpriv --no-new-privs; these four capabilities are all it needs.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${MF_MEMORY_LIMIT:-512M}
          pids: 512 # processes and threads, as for the gateway

  # ntfy: holds the members' notifications until their Android app picks them up (it keeps
  # them for 12 hours, in memory, for a phone that was offline). The gateway is its only user:
  # it publishes with the mtg_ntfy_token secret and relays each member's own topic to their app
  # at /app/notifications/stream, on the gateway's address. No published port: don't put a
  # reverse proxy in front of it. Every other request is refused, and its web app is off.
  ntfy:
    image: ${NTFY_IMAGE:-binwiederhier/ntfy:v2.31.1@sha256:91bb7fa607b02006c119bb4a31032923b414a713a032ecb40f0c5d6bfd5b7e40}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # The gateway's only user is made at each start from the secret (a random password nobody
    # knows, the token, and read-write on the members' mtg- topics); the token goes in the
    # environment of ntfy alone, never on its command line. "$$" is a "$" for the shell.
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        pw=$$(head -c 32 /dev/urandom | base64)
        hash=$$(printf '%s\n%s\n' "$$pw" "$$pw" | ntfy user hash 2>/dev/null | tr ' ' '\n' | grep '^\$$2')
        NTFY_AUTH_USERS="mtg-gateway:$$hash:user"
        NTFY_AUTH_TOKENS="mtg-gateway:$$(cat /run/secrets/mtg_ntfy_token):gateway"
        export NTFY_AUTH_USERS NTFY_AUTH_TOKENS
        unset pw hash
        exec ntfy serve
    environment:
      NTFY_LISTEN_HTTP: ":8080"
      NTFY_AUTH_FILE: /tmp/ntfy-auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_AUTH_ACCESS: "mtg-gateway:mtg-*:rw"
      NTFY_WEB_ROOT: disable
      NTFY_CACHE_DURATION: 12h
      # Every phone's connection reaches ntfy from the gateway, so ntfy counts them all as one
      # visitor: room for the gateway's own cap of 200 connections, and for a mass reconnect
      # (ntfy 2.31.1's defaults are 30 subscriptions and a burst of 60 requests, one more per 5 s).
      NTFY_VISITOR_SUBSCRIPTION_LIMIT: "250"
      NTFY_VISITOR_REQUEST_LIMIT_BURST: "600"
      NTFY_VISITOR_REQUEST_LIMIT_REPLENISH: "1s"
      TZ: ${TIMEZONE:-UTC}
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/v1/health
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    secrets:
      - mtg_ntfy_token
    # Runs as PUID (the owner of the secret files), with no capabilities at all: it listens on
    # 8080 and writes only to /tmp.
    user: "${PUID:-1000}:${PGID:-1000}"
    networks:
      - ntfy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${NTFY_MEMORY_LIMIT:-128M}
          pids: 128

  # Forge, the rules engine for deck simulations (docker/forge/, GPL-3.0, unmodified). On by default:
  # the example .env sets COMPOSE_PROFILES=forge, and MTG_FORGE_URL=http://forge:8000 for the
  # gateway; remove the first and empty the second to run without it. It starts Java only while a
  # simulation runs, as many games at once as its CPUs and memory fit (or FORGE_MAX_PARALLEL when
  # set), and needs no internet.
  forge:
    profiles: ["forge"]
    image: ${FORGE_IMAGE:-ghcr.io/theuncleben/mtg-assistant-forge}:${FORGE_TAG:-2.0.15-mag6}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      FORGE_XMX: ${FORGE_XMX:-1g}
      # The memory limit again, which sizes Forge's games at once where Docker can't cap memory
      # (Raspberry Pi OS by default); not a hard limit as Docker's is
      FORGE_MEMORY_BUDGET: ${FORGE_MEMORY_LIMIT:-1536M}
      FORGE_MAX_GAMES: ${FORGE_MAX_GAMES:-50}
      FORGE_GAME_SECONDS: ${FORGE_GAME_SECONDS:-240}
      # Forge games played at once at most (1 to 16); empty: as many as the container's CPUs and
      # memory fit (about 2 CPUs and 1.2 GB a game), so 1 inside the default limits
      FORGE_MAX_PARALLEL: ${FORGE_MAX_PARALLEL:-}
      # Each Forge game's extra Java memory for loaded code (on top of FORGE_XMX), and how readily
      # the kernel stops a Forge game when the machine runs out of memory (1000: Forge goes first;
      # 0 = off)
      FORGE_MAX_METASPACE: ${FORGE_MAX_METASPACE:-256m}
      FORGE_OOM_SCORE_ADJ: ${FORGE_OOM_SCORE_ADJ:-1000}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TIMEZONE:-UTC}
    networks:
      - forge
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${FORGE_MEMORY_LIMIT:-1536M}
          cpus: "${FORGE_CPUS:-2}"
          pids: 512

networks:
  mtg:
    name: ${MTG_NETWORK_NAME:-mtg-gateway}
  # Only the gateway and Mystic Forge are on it. Not "internal": Mystic Forge needs outbound
  # internet access for Scryfall, EDHREC and the rules. Mystic Forge has no login of its own,
  # and processes on this machine can reach a bridge network's containers by their IP, so
  # don't attach other containers to it and don't publish its port.
  mysticforge:
  # Only the gateway and Forge are on it, and it has no way out: Forge needs no internet.
  forge:
    internal: true
  # Only the gateway and ntfy are on it, and it has no way out: phones never reach ntfy directly.
  ntfy:
    internal: true
