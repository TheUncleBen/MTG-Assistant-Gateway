# MTG Assistant Gateway: Portainer / Docker Swarm stack (gateway, Mystic Forge, ntfy, Forge).
# Paste as is. Your settings go in the stack's variables (deploy/stack.env.example).
# Before deploying: the five secrets (docs/DEPLOY.md step 4) and the overlay network (step 1).

version: "3.8"

secrets:
  mtg_fernet_key:
    external: true
  mtg_session_secret:
    external: true
  mtg_oidc_client_secret:
    external: true
  # Authentik API token for the removed-member clean-up, or the word off.
  mtg_authentik_api_token:
    external: true
  # The gateway's token for the stack's own ntfy server.
  mtg_ntfy_token:
    external: true

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # The gateway. Its database lives on MTG_NODE.
  mtg-assistant-gateway:
    image: ghcr.io/theuncleben/mtg-assistant-gateway:${MTG_TAG:-latest}
    # Lets running requests and a deck apply finish before a redeploy stops it.
    stop_grace_period: 200s
    logging: *logging
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    secrets:
      - mtg_fernet_key
      - mtg_session_secret
      - mtg_oidc_client_secret
      - mtg_ntfy_token
      - mtg_authentik_api_token
    environment:
      MTG_PUBLIC_URL: ${MTG_PUBLIC_URL:?PUBLIC HTTPS URL REQUIRED e.g. https://mtg.example.com}
      MTG_OIDC_ISSUER: ${MTG_OIDC_ISSUER:?OIDC ISSUER URL REQUIRED}
      MTG_OIDC_CLIENT_ID: ${MTG_OIDC_CLIENT_ID:?OIDC CLIENT ID REQUIRED}
      MTG_REQUIRED_GROUP: ${MTG_REQUIRED_GROUP:-}
      MTG_ALLOW_ANY_IDP_USER: ${MTG_ALLOW_ANY_IDP_USER:-false}
      MTG_ADMIN_GROUP: ${MTG_ADMIN_GROUP:-}
      MTG_OIDC_GROUPS_CLAIM: ${MTG_OIDC_GROUPS_CLAIM:-}
      MTG_OIDC_SCOPES: ${MTG_OIDC_SCOPES:-openid profile email offline_access}
      MTG_OIDC_TOKEN_AUTH_METHOD: ${MTG_OIDC_TOKEN_AUTH_METHOD:-}
      MTG_OIDC_PREVIOUS_ISSUERS: ${MTG_OIDC_PREVIOUS_ISSUERS:-}
      MTG_WRITES_ENABLED: ${MTG_WRITES_ENABLED:-true}
      MTG_WATCHLISTS_ENABLED: ${MTG_WATCHLISTS_ENABLED:-}
      MTG_ARCHIDEKT_BACKUPS: ${MTG_ARCHIDEKT_BACKUPS:-}
      MTG_APPLY_IN_CHAT: ${MTG_APPLY_IN_CHAT:-}
      MTG_SCAN_ART_ENABLED: ${MTG_SCAN_ART_ENABLED:-}
      MTG_UPDATE_CHECK: ${MTG_UPDATE_CHECK:-}
      MTG_DECK_SYNC_MINUTES: ${MTG_DECK_SYNC_MINUTES:-}
      MTG_SERVER_NAME: ${MTG_SERVER_NAME:-}
      MTG_TRUSTED_PROXIES: ${MTG_TRUSTED_PROXIES:-}
      MTG_CIMD_ENABLED: ${MTG_CIMD_ENABLED:-true}
      MTG_CIMD_ALLOWED_HOSTS: ${MTG_CIMD_ALLOWED_HOSTS:-}
      MTG_ACCESS_TOKEN_TTL: ${MTG_ACCESS_TOKEN_TTL:-}
      MTG_REFRESH_TOKEN_TTL: ${MTG_REFRESH_TOKEN_TTL:-}
      MTG_BROWSER_SESSION_TTL: ${MTG_BROWSER_SESSION_TTL:-}
      MTG_REAUTH_INTERVAL: ${MTG_REAUTH_INTERVAL:-604800}
      MTG_MEMBERSHIP_CHECK_TTL: ${MTG_MEMBERSHIP_CHECK_TTL:-5}
      # Fixed: secrets, the stack's own services, the backup copy folder (mounted below)
      # and Forge on or off (FORGE_REPLICAS).
      MTG_OIDC_CLIENT_SECRET_FILE: /run/secrets/mtg_oidc_client_secret
      MTG_FERNET_KEY_FILE: /run/secrets/mtg_fernet_key
      MTG_SESSION_SECRET_FILE: /run/secrets/mtg_session_secret
      MTG_AUTHENTIK_API_TOKEN_FILE: /run/secrets/mtg_authentik_api_token
      MTG_NTFY_TOKEN_FILE: /run/secrets/mtg_ntfy_token
      MTG_NTFY_URL: http://mtg-assistant-ntfy:8080
      MTG_MYSTIC_FORGE_URL: http://mtg-assistant-mysticforge:8000/mcp
      MTG_FORGE_URL: http://mtg-assistant-forge:8000
      MTG_FORGE_REPLICAS: ${FORGE_REPLICAS:-1}
      MTG_BACKUP_COPY_DIR: /backup-copy
      PUID: ${PUID:?PUID REQUIRED}
      PGID: ${PGID:?PGID REQUIRED}
      TZ: ${TIMEZONE:-UTC}
      DISABLE_IPV6: "true"
    # Least privilege: root only to match PUID/PGID, then it drops to that user.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    networks:
      - mtgnet
      - mysticforge
      - forge
      - ntfy
    volumes:
      - type: bind
        source: ${MTG_DATA_DIR:?GATEWAY DATA DIRECTORY REQUIRED}
        target: /data
      - type: bind
        source: ${MTG_BACKUP_DIR:?GATEWAY BACKUP DIRECTORY REQUIRED}
        target: /backups
      # Empty MTG_BACKUP_COPY_DIR mounts /dev/null: no copies.
      - type: bind
        source: ${MTG_BACKUP_COPY_DIR:-/dev/null}
        target: /backup-copy
    deploy:
      replicas: 1
      resources:
        limits:
          memory: ${MTG_MEMORY_LIMIT:-256M}
        reservations:
          memory: 64M
      restart_policy:
        condition: any
      update_config:
        order: stop-first
      rollback_config:
        order: stop-first
      placement:
        constraints:
          - node.hostname == ${MTG_NODE:?set MTG_NODE to the Swarm node that keeps the gateway data}

  # Mystic Forge: the research service. Only the gateway can reach it; no proxy host for it.
  mtg-assistant-mysticforge:
    image: ghcr.io/theuncleben/mtg-assistant-mysticforge:1.3.2-mag7
    logging: *logging
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=8)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      MYSTIC_FORGE_NO_INGEST: "1"
      MYSTIC_FORGE_NTFY_OFF: "1"
      MYSTIC_FORGE_PUBLIC_BASE: http://mtg-assistant-mysticforge:8000
      MYSTIC_FORGE_DB: /data/mystic_forge.db
      MYSTIC_FORGE_CR: /data/cr_cache.txt
      PUID: ${PUID:?PUID REQUIRED}
      PGID: ${PGID:?PGID REQUIRED}
      TZ: ${TIMEZONE:-UTC}
      DISABLE_IPV6: "true"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    networks:
      - mysticforge
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
      restart_policy:
        condition: any
      update_config:
        order: stop-first
      rollback_config:
        order: stop-first

  # ntfy: holds members' phone notifications. Only the gateway can reach it; no proxy host for it.
  mtg-assistant-ntfy:
    image: binwiederhier/ntfy:v2.31.1@sha256:91bb7fa607b02006c119bb4a31032923b414a713a032ecb40f0c5d6bfd5b7e40
    logging: *logging
    # Makes the gateway's only user from the secret at each start. "$$" is "$" for the shell.
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        pw=$$(head -c 32 /dev/urandom | base64)
        hash=$$(printf '%s\n%s\n' "$$pw" "$$pw" | ntfy user hash 2>/dev/null | tr ' ' '\n' | grep '^\$$2')
        NTFY_AUTH_USERS="mtg-gateway:$$hash:user"
        NTFY_AUTH_TOKENS="mtg-gateway:$$(cat /run/secrets/mtg_ntfy_token):gateway"
        export NTFY_AUTH_USERS NTFY_AUTH_TOKENS
        unset pw hash
        exec ntfy serve
    environment:
      NTFY_LISTEN_HTTP: ":8080"
      NTFY_AUTH_FILE: /tmp/ntfy-auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_AUTH_ACCESS: "mtg-gateway:mtg-*:rw"
      NTFY_WEB_ROOT: disable
      NTFY_CACHE_DURATION: 12h
      # All phones reach ntfy through the gateway, so it counts as one visitor.
      NTFY_VISITOR_SUBSCRIPTION_LIMIT: "250"
      NTFY_VISITOR_REQUEST_LIMIT_BURST: "600"
      NTFY_VISITOR_REQUEST_LIMIT_REPLENISH: "1s"
      TZ: ${TIMEZONE:-UTC}
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/v1/health
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    secrets:
      - mtg_ntfy_token
    user: "${PUID:?PUID REQUIRED}:${PGID:?PGID REQUIRED}"
    cap_drop:
      - ALL
    networks:
      - ntfy
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 16M
      restart_policy:
        condition: any
      update_config:
        order: stop-first
      rollback_config:
        order: stop-first
      placement:
        constraints:
          - node.hostname == ${MTG_NODE:?set MTG_NODE to the Swarm node that keeps the gateway data}

  # Forge: the rules engine for simulations (GPL-3.0). FORGE_REPLICAS=0 turns it off.
  # No internet; Java runs only during a simulation, inside the limits below.
  mtg-assistant-forge:
    image: ghcr.io/theuncleben/mtg-assistant-forge:2.0.15-mag6
    logging: *logging
    environment:
      # Sizes games at once where Docker can't cap memory (Raspberry Pi OS).
      FORGE_MEMORY_BUDGET: ${FORGE_MEMORY_LIMIT:-1536M}
      PUID: ${PUID:?PUID REQUIRED}
      PGID: ${PGID:?PGID REQUIRED}
      TZ: ${TIMEZONE:-UTC}
      DISABLE_IPV6: "true"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    networks:
      - forge
    deploy:
      replicas: ${FORGE_REPLICAS:-1}
      endpoint_mode: dnsrr
      resources:
        limits:
          memory: ${FORGE_MEMORY_LIMIT:-1536M}
          cpus: "${FORGE_CPUS:-2}"
        reservations:
          memory: 64M
      restart_policy:
        condition: any
      update_config:
        order: stop-first
      rollback_config:
        order: stop-first
      placement:
        constraints:
          - node.hostname == ${FORGE_NODE:?set FORGE_NODE to the Swarm node that runs Forge}

networks:
  # Shared with your reverse proxy.
  mtgnet:
    external: true
    name: ${MTG_NETWORK_NAME:-mtg-gateway}
  # Private to this stack. Mystic Forge needs the internet; Forge and ntfy don't.
  mysticforge:
    driver: overlay
  forge:
    driver: overlay
    internal: true
  ntfy:
    driver: overlay
    internal: true
