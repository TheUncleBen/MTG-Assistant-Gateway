# Test-only reverse proxy standing in for Nginx Proxy Manager. The two server
# blocks mirror the proxy-host settings docs/DEPLOY.md asks the owner to set:
# scheme http to the service name, websockets on, X-Forwarded-* headers,
# proxy_buffering off and a 300 s read timeout for the gateway.
worker_processes 1;
events { worker_connections 256; }
http {
  resolver 127.0.0.11 valid=10s;
  access_log /dev/stdout;
  error_log /dev/stderr info;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 443 ssl;
    http2 on;
    server_name mtg.e2e.test;
    ssl_certificate /etc/nginx/edge.crt;
    ssl_certificate_key /etc/nginx/edge.key;
    location / {
      # tasks.<service> resolves to the task IPs (no virtual IP), so this also works
      # on a single-node Swarm without IPVS. NPM uses the plain service name.
      set $upstream tasks.mtg-assistant-gateway;
      proxy_pass http://$upstream:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 300s;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name auth.e2e.test;
    ssl_certificate /etc/nginx/edge.crt;
    ssl_certificate_key /etc/nginx/edge.key;
    location / {
      set $upstream authentik-server;
      proxy_pass http://$upstream:9000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
    }
  }

  # Anything else (an unknown Host header) is refused, like NPM's default page.
  server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/edge.crt;
    ssl_certificate_key /etc/nginx/edge.key;
    return 444;
  }
}
