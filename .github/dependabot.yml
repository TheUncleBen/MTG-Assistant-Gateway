# Update pull requests for pinned dependencies. Nothing merges by itself: each PR runs CI and needs
# a review. Actions and base images are pinned by commit SHA and digest, so without this they would
# never move.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directories:
      - /
      - /docker/mystic-forge
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
