# The Gradle daemon's JVM. CI's android-check lost its daemon to a JVM crash once (hs_err log, heap
# at 0% of 2 GiB as lint started), so the heap has room for lint and the metaspace a ceiling instead of
# growing with the machine's free memory; the job keeps the crash log when it happens again.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
