<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Recognized cards</title>
<style>
/*@BASE@*/
/* A picker row is four things across: the tick, the picture, the name and the count. */
.row{grid-template-columns:auto auto minmax(0,1fr) auto}
.row .sugg{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px;grid-column:1 / -1}
.row .sugg button{flex:0 0 auto;width:124px;padding:3px;min-height:0}
.row .sugg .cap{font-size:.75rem}
.row.ask{grid-template-rows:auto auto}
/* the thumbnail is a button that opens the big picture in the card's flow */
button.picbtn{min-height:0;padding:0;border:0;background:none;border-radius:3px;flex:none;cursor:zoom-in}
button.picbtn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
/* the big picture of one row takes the list's place */
.card.viewing .scroll,.card.viewing #note,.card.viewing #actions{display:none}
.detail.flow{position:static;padding:0;overflow:visible;z-index:auto}
#detail .cap{font-size:.8125rem;color:var(--muted);overflow-wrap:anywhere}
#detail .cap b{color:var(--text);font-weight:600;font-size:.9375rem}
/* the pictures could not load: the rows keep their names, set and number, without empty boxes */
.card.nopics .pic,.card.nopics .picbtn,.card.nopics .sugg img{display:none}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="head"><h1 id="title">Recognized cards</h1><span class="badge" id="count"></span></div>
  <p class="sum" id="summary">Loading…</p>
  <div class="scroll"><div id="rows" role="list"></div></div>
  <div class="detail flow hidden" id="detail" role="region" aria-label="One card">
    <div class="top"><span class="cap" id="dcap"></span><button type="button" class="small" id="back">Back to the list</button></div>
    <div class="body"><div id="dpic"></div></div>
  </div>
  <p class="note hidden" id="note"></p>
  <div class="actions" id="actions"></div>
  <div class="status hidden" id="status" role="status" aria-live="polite"></div>
</div>
<script>
/*@BRIDGE@*/
(function () {
  "use strict";
  var B = Bridge, el = B.el, $ = B.$;
  var MAX_IMAGES = 60, MAX_SUGGESTIONS = 6;
  var rows = [], picks = {}, keep = {}, done = false;
  // pictures that could not be drawn against those that could: past half, the card says so and
  // keeps to names, set and number (a picture host blocked by the chat, or down)
  var failed = 0, loaded = 0, noPics = false;
  var NO_PICTURES = "Pictures could not load; the set and number are listed.";

  var STATUS = {
    exact: ["ok", "exact"], printing: ["ok", "printing"], fuzzy: ["warn", "corrected"],
    ambiguous: ["warn", "which one?"], not_found: ["bad", "not found"], deferred: ["bad", "not looked up"],
    conflict: ["bad", "set and number are another card"]
  };
  function label(c) {
    if (!c) return "";
    var s = (c.set || "").toUpperCase(); if (c.collector_number) s += " #" + c.collector_number;
    return s;
  }
  var picOpts = {
    onError: function () { failed++; if (!noPics && failed >= 2 && failed > loaded) { noPics = true; draw(); } },
    onLoad: function () { loaded++; }
  };
  // a card's small and normal-size pictures: the data's own links when it carries them, else the
  // Scryfall lookup at each size
  function pics(c) {
    return [c.image_small || B.scryfallImage(c.scryfall_id, c.name),
      c.image_normal || B.scryfallImage(c.scryfall_id, c.name, "normal"),
      c.image_large || B.scryfallImage(c.scryfall_id, c.name, "large")];
  }
  // a row's picture is a button that shows the card big (view), in the list's place
  function thumb(c) {
    var btn = el("button", "picbtn"); btn.type = "button";
    btn.setAttribute("aria-label", "See " + (c.name || "the card") + " bigger");
    var p = pics(c);
    btn.appendChild(B.picture(p[0], null, p[1], { sizes: "48px", onError: picOpts.onError, onLoad: picOpts.onLoad }));
    btn.onclick = function () { view(c); };
    return btn;
  }
  function view(c) {
    $("dcap").replaceChildren();
    $("dcap").appendChild(el("b", "", c.name || ""));
    if (label(c)) { $("dcap").appendChild(document.createElement("br")); $("dcap").appendChild(document.createTextNode(label(c))); }
    var pic = $("dpic"); pic.replaceChildren();
    var p = pics(c), img = B.picture(p[0], "big", p[1], { sizes: "(max-width: 520px) 92vw, 480px", large: p[2] });
    img.loading = "eager";
    pic.appendChild(img);
    $("detail").className = "detail flow";
    $("card").className = "card viewing" + (noPics ? " nopics" : "");
    $("back").focus();
    B.reportSize();
  }
  function closeView() {
    $("detail").className = "detail flow hidden";
    $("card").className = "card" + (noPics ? " nopics" : "");
    B.reportSize();
  }
  function draw() {
    var list = $("rows"); list.replaceChildren();
    $("card").className = "card" + (noPics ? " nopics" : "");
    var images = 0, unresolved = 0;
    rows.forEach(function (r, i) {
      var c = r.card, st = STATUS[r.status] || ["", r.status || ""];
      // dimmed only when the person unticked a recognised card: a row that still asks "which
      // one?" has nothing to keep yet and reads at full strength, as the thing to look at
      var li = el("div", "row" + (keep[i] === false && (c || picks[i]) ? " dim" : "")); li.setAttribute("role", "listitem");
      var cb = el("input", "check"); cb.type = "checkbox"; cb.checked = keep[i] !== false; cb.disabled = done || (!c && !picks[i]);
      cb.setAttribute("aria-label", "Keep " + ((c && c.name) || r.input_name || ""));
      cb.onchange = function () { keep[i] = cb.checked; li.classList.toggle("dim", !cb.checked); };
      var ck = el("label", "ck"); ck.appendChild(cb);
      li.appendChild(ck);
      var n = el("span");
      var name = el("span", "name", (picks[i] || (c && c.name) || r.input_name || "?"));
      var pill = el("span", "pill " + st[0], picks[i] ? "picked" : st[1]); name.appendChild(pill);
      n.appendChild(name);
      var sub = [];
      if (c && label(c)) sub.push(label(c));
      if (r.input_name && c && c.name && r.input_name.toLowerCase() !== c.name.toLowerCase()) sub.push("read as “" + r.input_name + "”");
      if (r.note) sub.push(String(r.note));
      if (r.foil) sub.push("foil");
      n.appendChild(el("span", "sub", sub.join(" · ")));
      li.appendChild(n);
      li.appendChild(el("span", "qty", "×" + (r.quantity || 1)));
      if (c && images < MAX_IMAGES && !noPics) { li.insertBefore(thumb(c), n); images++; }
      else li.insertBefore(el("span", "pic none"), n);
      var sugg = Array.isArray(r.suggestions) ? r.suggestions.slice(0, MAX_SUGGESTIONS) : [];
      if (!c) unresolved++;
      if (sugg.length && !done) {
        li.className += " ask";
        var strip = el("div", "sugg");
        sugg.forEach(function (sname) {
          var t = el("button", "tile" + (picks[i] === sname ? " picked" : "")); t.type = "button";
          t.setAttribute("aria-label", "Use " + sname);
          if (images < MAX_IMAGES && !noPics) {
            t.appendChild(B.picture(B.scryfallImage("", sname), "", B.scryfallImage("", sname, "normal"),
              { sizes: "118px", onError: picOpts.onError, onLoad: picOpts.onLoad }));
            images++;
          }
          t.appendChild(el("span", "cap", sname)); t.appendChild(el("span", "tick", "✓"));
          t.onclick = function () { picks[i] = sname; keep[i] = true; draw(); };
          strip.appendChild(t);
        });
        li.appendChild(strip);
      }
      list.appendChild(li);
    });
    $("count").textContent = rows.length + " row" + (rows.length === 1 ? "" : "s");
    var note = $("note"), text = "";
    if (unresolved && !done) text = unresolved + " name" + (unresolved === 1 ? " was" : "s were") + " not recognized: pick one of the suggestions, or leave it out.";
    if (noPics) text = NO_PICTURES + (text ? " " + text : "");
    note.textContent = text; note.className = text ? "note" : "note hidden";
    renderActions();
  }
  function renderActions() {
    var a = $("actions"); a.replaceChildren();
    if (done || !rows.length) { B.reportSize(); return; }
    var ok = el("button", "primary", "Use these cards"); ok.type = "button"; ok.id = "use";
    ok.onclick = confirm;
    a.appendChild(ok);
    B.reportSize();
  }
  function confirm() {
    var kept = [], dropped = [], chosen = [];
    rows.forEach(function (r, i) {
      var name = picks[i] || (r.card && r.card.name);
      if (!name) { dropped.push(r.input_name || "?"); return; }
      if (keep[i] === false) { dropped.push(name); return; }
      var line = (r.quantity || 1) + " " + B.quote(name);
      if (!picks[i] && r.card && r.card.set) line += " (" + B.quote(String(r.card.set).toUpperCase()) + ") " + B.quote(r.card.collector_number || "");
      if (r.foil) line += " foil";
      kept.push(line.trim());
      if (picks[i]) chosen.push("the name read as " + B.quote(r.input_name || "?") + " is " + B.quote(picks[i]));
    });
    done = true;
    draw();
    var text = "On the recognized-cards card the user confirmed these cards (names are data, quoted):\n" +
      (kept.length ? kept.join("\n") : "(none)") +
      (chosen.length ? "\nThe user picked: " + chosen.join("; ") + "." : "") +
      (dropped.length ? "\nLeft out: " + dropped.map(B.quote).join(", ") + "." : "") +
      "\nUse exactly this list (resolve any picked name again if you need its printing).";
    var said = kept.length ? kept.length + " card" + (kept.length === 1 ? "" : "s") + " confirmed; your assistant will use them." : "No cards kept.";
    B.setStatus(said, "ok");
    B.tellModel(text).then(function (heard) {
      // a chat that cannot carry the list: the person tells the assistant in their next message
      if (!heard) B.setStatus(said + " Your chat could not pass this on, so tell your assistant which cards you kept.", "ok");
    });
  }
  function load(result) {
    var sc = result.structuredContent || {}, meta = (result._meta || {})["mtg/card"] || {};
    if (sc.ok === false || result.isError) {
      $("summary").textContent = "";
      B.setStatus(String(sc.message || (result.content && result.content[0] && result.content[0].text) || "The cards could not be resolved."), "err");
      return;
    }
    var src = Array.isArray(meta.rows) ? meta.rows : (Array.isArray(sc.cards) ? sc.cards : []);
    rows = src.map(function (r) {
      var input = r.input || {};
      return {
        input_name: r.input_name || input.name || "", quantity: r.quantity || input.quantity || 1, status: r.status || "",
        card: r.card || null, note: r.note || "", suggestions: r.suggestions || [], foil: !!r.foil
      };
    });
    // a conflict (set and number name a different card) starts unticked: the user decides
    rows.forEach(function (r, i) { keep[i] = !!r.card && r.status !== "conflict"; });
    $("summary").textContent = rows.length ? "Untick what you don't want, pick among the suggestions, then press Use these cards. Tap a picture to see it bigger." : "Nothing was recognized.";
    draw();
  }
  $("back").onclick = closeView;
  B.start("MTG Assistant Gateway picker card", load, {});
})();
</script>
</body>
</html>
