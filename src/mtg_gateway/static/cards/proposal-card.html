<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Deck change proposal</title>
<style>
/*@BASE@*/
/* The proposal card's own look on top of the shared base. */
.card{max-width:720px}
.badge.pending{background:var(--amber-bg);color:var(--amber)}
.badge.applying{background:var(--blue-bg);color:var(--blue)}
.badge.applied{background:var(--green-bg);color:var(--green)}
.badge.failed,.badge.needs_look{background:var(--red-bg);color:var(--red)}
.badge.updated{background:var(--blue-bg);color:var(--blue)}
.badge.rejected,.badge.expired,.badge.withdrawn,.badge.replaced{background:var(--bg2);color:var(--muted)}
ul.changes{list-style:none;margin:0;padding:0;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
ul.changes li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px 10px;
  border-top:1px solid var(--border);border-left:4px solid var(--border);background:var(--bg)}
ul.changes li:first-child{border-top:0}
ul.changes li.add{border-left-color:var(--green)} ul.changes li.remove{border-left-color:var(--red)}
ul.changes li.change,ul.changes li.category,ul.changes li.finish,ul.changes li.printing,ul.changes li.commander,
ul.changes li.detail,ul.changes li.description{border-left-color:var(--blue)}
/* A row with no picture (a setting, or a picture that did not load) leaves no empty column. */
ul.changes li.nopic{grid-template-columns:minmax(0,1fr) auto}
.act{font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:block}
li.add .act{color:var(--green)} li.remove .act{color:var(--red)}
.name{display:block;overflow-wrap:anywhere}
.name .sub{display:block;font-size:.75rem;color:var(--muted);margin-top:1px}
.qty{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;font-size:.8125rem;color:var(--muted)}
/* A change's text (Main → Maybeboard) may wrap, so on a narrow card it never squeezes the card name to a letter a line. */
ul.changes li .qty{white-space:normal;text-align:right;overflow-wrap:anywhere;max-width:min(20em,32vw)}
/* On a narrow card the count or change sits on the action's line, so a row takes two lines, not three. */
@media (max-width:420px){
  /* the action label keeps its own width and a long change (Main → Maybeboard …) wraps beside
     it, so the two never overlap */
  ul.changes li:not(.group):not(.more-row){grid-template-columns:auto max-content minmax(0,1fr);
    grid-template-areas:"pic act qty" "pic name name";row-gap:2px;column-gap:10px}
  ul.changes li.nopic{grid-template-columns:max-content minmax(0,1fr);grid-template-areas:"act qty" "name name"}
  ul.changes li .txt{display:contents}
  ul.changes li .pic{grid-area:pic} ul.changes li .act{grid-area:act;align-self:end}
  ul.changes li .name{grid-area:name} ul.changes li .qty{grid-area:qty;align-self:end;max-width:none;justify-self:end}
}
li.add .qty{color:var(--green)} li.remove .qty{color:var(--red)}
ul.changes li.group{display:block;padding:5px 10px;font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);background:var(--bg2);border-left-color:var(--border)}
ul.changes li.more-row{display:block;padding:4px 10px;border-left-color:var(--border)}
/* The state and risk badges stay whole: on a narrow card the risk badge moves under the state one. */
.badges{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;flex:0 1 auto;min-width:min-content}
.badge.risk.high{background:var(--amber-bg);color:var(--amber)}
.badge.risk.low{background:var(--green-bg);color:var(--green)}
.badge.risk.consent{background:var(--blue-bg);color:var(--blue)}
.badge.risk.destructive{background:var(--red-bg);color:var(--red)}
/* At large text sizes the badges move under the title rather than over it,
   and the risk badge may wrap */
.head{flex-wrap:wrap}
.head h1{flex:1 1 10rem}
.head .badges{margin-left:auto}
.badge.risk{white-space:normal;text-align:center;flex:0 1 auto}
/* beside the High label when Full auto applies the change anyway: a plain note, not a label */
.nopress{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;color:var(--muted);white-space:nowrap}
.nopress svg.i{width:12px;height:12px;fill:none;stroke:var(--green);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
/* Locked (the 700 ms after drawing, and while a press is out), a button keeps a label that reads:
   full-strength text with a dashed outline in its own colour, not faded (as the review page's
   Apply and Reject) */
button:disabled{opacity:1;cursor:default;background:transparent;border:1px dashed currentColor;color:var(--text)}
button.danger:disabled{color:var(--red)}
.why{margin-top:10px;padding:10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg2)}
.why label{display:block;font-size:.8125rem;margin-bottom:6px}
.why textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);
  width:100%;min-height:64px;padding:8px 10px;resize:vertical}
.why .actions{margin-top:8px}
/* The other changes waiting on this deck: one line, Apply all and Review all. */
.also{margin-top:12px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg2)}
.also p{margin:0;font-size:.8125rem;overflow-wrap:anywhere}
.also .actions{margin-top:8px}
.also ol{margin:6px 0 0;padding-left:22px;font-size:.8125rem}
.also ol li{margin:3px 0;overflow-wrap:anywhere}
.also ol .why{display:block;font-size:.75rem;color:var(--muted)}
/* What an Apply all did not send, each with why. */
.notsent{margin:8px 0 0;padding-left:22px;font-size:.8125rem}
.notsent li{margin:3px 0;overflow-wrap:anywhere}
/* A card that no longer asks for anything (a newer card below, or a proposal decided, withdrawn,
   replaced or expired): its heading and one line, no list and no pictures. */
.card.stub .sum,.card.stub ul.changes,.card.stub .note,.card.stub .foot,.card.stub .also,.card.stub .why,
.card.stub .notsent{display:none}
.card.stub .status{margin-top:6px}
/* Open in the app or browser: a grey capsule (_base.css a.cap) under the status line, on a one-line card too */
.open-row{margin-top:10px}
.card.stub .head h1{font-size:1rem}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="head"><h1 id="title">Deck change proposal</h1><span class="badges"><span class="badge" id="state"></span><span class="badge risk hidden" id="risk"></span><span class="nopress hidden" id="nopress"></span></span></div>
  <p class="sum" id="summary">Waiting for the proposal…</p>
  <ul class="changes" id="rows" aria-label="Changes"></ul>
  <p class="note hidden" id="note"></p>
  <p class="foot" id="foot"></p>
  <div class="actions" id="actions"></div>
  <div class="also hidden" id="also" role="group" aria-labelledby="also-text" tabindex="-1">
    <p id="also-text"></p>
    <ol id="also-list" class="hidden"></ol>
    <div class="actions" id="also-actions"></div>
  </div>
  <div class="why hidden" id="why">
    <label for="reason">Tell your assistant why (optional), so it can propose something better:</label>
    <textarea id="reason" maxlength="500" placeholder="e.g. keep the Islands, cut a creature instead"></textarea>
    <div class="actions"><button type="button" class="danger" id="reject-go">Reject this proposal</button><button type="button" id="reject-cancel">Keep it open</button></div>
  </div>
  <div class="status hidden" id="status" role="status" aria-live="polite" tabindex="-1"></div>
  <div class="open-row hidden" id="open-row"></div>
  <ul class="notsent hidden" id="not-sent" aria-label="Not sent"></ul>
</div>
<script>
/*@BRIDGE@*/
(function () {
  "use strict";
  // "Held: it depends on #3, …", as the Proposals page writes it (batch.held_text)
  function lowerFirst(t) { return t ? t.charAt(0).toLowerCase() + t.slice(1) : t; }
  var B = Bridge; // the shared host protocol (_bridge.js), inlined by cards.card_html
  var APPROVAL_KEY = "mtg/approval";
  var SET_KEY = "mtg/approval_set"; // "Apply all": this app's waiting changes on the deck
  var MAX_IMAGES = 6;    // Scryfall thumbnails at most: the first rows only, the rest is text
  var COLLAPSE_AT = 6;   // a longer list shows a summary and this many rows until "Show all"
  var ROWS_READ = 8;     // rows a timed read asks for (Show all reads the whole list once)
  var ARM_DELAY_MS = 700; // buttons stay disabled this long after the card is drawn
  // While a waiting proposal's card is on screen it reads the proposal again this often, so it
  // follows an amend, a withdraw or a press elsewhere; at most REFRESH_MAX timed reads each time it
  // comes on screen (Approve reads it once more anyway).
  var REFRESH_EVERY_MS = 30000, REFRESH_MAX = 6;
  var APPLYING_POLL_MS = 5000; // how often a running apply's progress is read
  // A read that fails is tried again after 2 s, 4 s, 8 s ... (at most a minute apart), up to
  // RETRY_MAX times, so a card never keeps showing buttons it could not check
  var RETRY_FIRST_MS = 2000, RETRY_LAST_MS = 60000, RETRY_MAX = 6;
  // This card's own number among the cards drawn for its proposal in this chat (the result that
  // drew it says so); a read that names a higher one means a newer card is below
  var mySeq = 0, stepped = false;
  var pressedHere = false; // this card's own Approve or Apply all decided it: it keeps the outcome
  var proposal = null, approval = null, armed = false, busy = false, heldCode = null;
  var applySet = null, confirming = false;
  var request = B.request, reportSize = B.reportSize, el = B.el, $ = B.$, setStatus = B.setStatus, tellModel = B.tellModel;
  function openLink(url) { B.openLink(url, function (text) { setStatus(text, ""); }); }

  // -- rendering (every value goes through textContent; names are data, never markup) ---------
  function label(r) {
    var l = r.name == null ? "" : String(r.name);
    if (r.printing) l += " " + r.printing;
    if (r.category) l += " [" + r.category + "]";
    if (r.guessed_from) l += " (name guessed from '" + r.guessed_from + "'; check it)";
    if (r.missing) l += " (Archidekt doesn't have this card)";
    else if (r.unchecked) l += " (not checked)";
    return l;
  }
  function arrow(a, b) { return String(a) + " → " + String(b); }
  // The new description as the user will approve it: its first 300 characters on one line.
  function excerpt(text, len) {
    var t = String(text == null ? "" : text).replace(/\s+/g, " ").trim();
    if (!t) return "changed, " + len + " chars";
    return "“" + (t.length > 300 ? t.slice(0, 299) + "…" : t) + "”";
  }
  // An account action in words; a comment edit, delete or vote also quotes the comment it is about,
  // as the review page does, so the right one is approved.
  function actionLine(r) {
    var t = String(r.text || "");
    var was = r.before_text ? excerpt(r.before_text, String(r.before_text).length) : "";
    if (r.after_text && was) return t + ": " + was + " → " + excerpt(r.after_text, String(r.after_text).length);
    if (r.after_text) return t + ": " + excerpt(r.after_text, String(r.after_text).length);
    return was ? t + ": " + was : t;
  }
  // Under a tags row, which tags are added and which taken off (as the review page says it).
  function tagNote(r) {
    if (r.field !== "tags") return "";
    var bits = [];
    if (Array.isArray(r.added) && r.added.length) bits.push("adds " + r.added.join(", "));
    if (Array.isArray(r.removed) && r.removed.length) bits.push("removes " + r.removed.join(", "));
    var s = bits.join("; ");
    return s ? s.charAt(0).toUpperCase() + s.slice(1) : "";
  }
  // Which app made the proposal, by its name; never its internal client id.
  function creator(label) {
    var s = String(label || ""), m = /^app: (.+) \((.+)\)$/.exec(s);
    if (m) return m[1];
    if (s.indexOf("app: ") === 0) return "an assistant";
    return s === "browser" ? "you, in your browser" : s;
  }
  function describeRow(r) {
    switch (r.kind) {
      case "add": return ["Add", label(r), "+" + r.qty];
      case "remove": return ["Remove", label(r), "−" + r.qty];
      case "change": return ["Change", label(r), arrow(r.before, r.after)];
      case "category": return ["Category", r.name, arrow(r.before, r.after) + (r.leaves ? " (leaves the deck, −" + r.leaves + ")" : "")];
      case "finish": return ["Finish", r.name, arrow(r.before, r.after)];
      case "printing": return ["Printing", r.name, arrow(r.before, r.after)];
      case "label": return ["Color tag", r.name, arrow(r.before, r.after)];
      case "mana_value": return ["Mana value", r.name, arrow(r.before, r.after)];
      case "companion": return ["Companion", r.name, arrow(r.before, r.after)];
      case "back_face": return ["Show back face", r.name, arrow(r.before, r.after)];
      case "commander": return ["Commander", arrow(r.before, r.after), ""];
      case "clone": return ["Copy", "'" + r.source + "' (" + r.cards + " cards) as '" + r.name + "'", ""];
      case "new_deck": return ["New deck", r.name + " (" + r.format + ", " + r.cards + " cards, " + (r.private ? "private" : "public") + ")", ""];
      case "restore": return ["Restore", "snapshot " + r.snapshot_id + " taken " + r.taken + " (" + r.rows + " rows)", ""];
      case "description": return ["Description", r.after_len ? excerpt(r.after_text, r.after_len) : "cleared", ""];
      case "detail": return [String(r.field || "Setting"), arrow(r.before, r.after), "", tagNote(r)];
      case "action": return [String(r.label || "Action"), actionLine(r), r.cannot_undo ? "Can't be undone" : ""];
      default: return ["Change", r.text || "", ""];
    }
  }
  var CARD_KINDS = { add: 1, remove: 1, change: 1, category: 1, finish: 1, printing: 1, label: 1 };
  function cardImage(name) {
    var img = el("img", "pic");
    img.alt = ""; img.loading = "lazy"; img.decoding = "async"; img.referrerPolicy = "no-referrer";
    img.src = "https://api.scryfall.com/cards/named?exact=" + encodeURIComponent(name) + "&format=image&version=small";
    // A picture that does not load leaves no empty slot: the row closes up like a setting's.
    img.onerror = function () { var li = img.parentNode; img.onerror = null; if (li) { li.removeChild(img); li.classList.add("nopic"); } };
    return img;
  }
  function titleFor(p) {
    var name = p.deck_name || p.deck_id || "";
    if (p.kind === "create_deck") return ((p.rows || []).some(function (r) { return r && r.kind === "new_deck" && r.package; }) ? "New card package: " : "New deck: ") + name;
    if (p.kind === "clone") return "Copy of " + name;
    if (p.kind === "restore") return "Restore " + name;
    if (p.kind === "details") return "Settings of " + name;
    if (p.kind === "collection") return "Your binder";
    if (p.kind === "action") return p.deck_id === "account" ? "Your Archidekt account" : "Archidekt: " + name;
    return "Change to " + name;
  }
  // Rows are shown grouped by what they do, in this order, so a big edit reads as a summary.
  var GROUPS = [
    ["add", "Added"], ["remove", "Removed"], ["change", "Quantity changed"], ["category", "Moved"],
    ["finish", "Finish"], ["printing", "Printing"], ["label", "Color tag"], ["mana_value", "Mana value"],
    ["companion", "Companion"], ["back_face", "Show back face"], ["commander", "Commander"]
  ];
  var OTHER_NOUN = { change: "quantity change", category: "move", finish: "finish change", printing: "printing change",
    label: "color tag change", mana_value: "mana value change", commander: "commander change" };
  function groupOf(kind) {
    for (var i = 0; i < GROUPS.length; i++) if (GROUPS[i][0] === kind) return i;
    return GROUPS.length;
  }
  function summaryFor(p, rows) {
    var nd = rows.filter(function (r) { return r && r.kind === "new_deck"; })[0];
    var warn = Array.isArray(p.warnings) ? p.warnings.length : 0;
    var warnText = warn ? " · " + warn + " warning" + (warn === 1 ? "" : "s") : "";
    if (nd) {
      // a new deck: its format and card count, as one line (the list itself starts below)
      var what = nd.package ? "Card package" : String(nd.format || "") + " deck";
      return what.charAt(0).toUpperCase() + what.slice(1) + ", " + Number(nd.cards || 0) + " cards" +
        (nd.side_cards ? " (+" + Number(nd.side_cards) + " sideboard)" : "") + ", " + (nd.private ? "private" : "public") + warnText;
    }
    var adds = 0, removes = 0, others = 0, total = rows.length;
    var sum = p.rows_summary;
    if (sum && typeof sum.rows === "number") {
      adds = Number(sum.adds) || 0; removes = Number(sum.removes) || 0; others = Number(sum.others) || 0; total = sum.rows;
    } else rows.forEach(function (r) {
      if (r.kind === "add") adds += Number(r.qty) || 0;
      else if (r.kind === "remove") removes += Number(r.qty) || 0;
      else others += 1;
    });
    var bits = [];
    if (adds) bits.push("+" + adds + " card" + (adds === 1 ? "" : "s"));
    if (removes) bits.push("−" + removes + " card" + (removes === 1 ? "" : "s"));
    // other changes of one kind are named as their group heading names them (A20)
    var kinds = Object.keys((sum && sum.groups) || rows.reduce(function (o, r) { o[r.kind] = 1; return o; }, {}))
      .filter(function (k) { return k !== "add" && k !== "remove"; });
    var noun = kinds.length === 1 ? (OTHER_NOUN[kinds[0]] || "other change") : "other change";
    if (others) bits.push(others + " " + noun + (others === 1 ? "" : "s"));
    var head = bits.length ? bits.join(", ") : (total + " change" + (total === 1 ? "" : "s"));
    if (total > 1) head = total + " rows: " + head;
    return head + warnText;
  }
  // 0.7.29: a waiting change checked again against the deck as it is now, or held.
  function statusNote(p) {
    if (p.state !== "pending" || !p.status) return "";
    var head = { updated: "Updated.", needs_look: "Needs a look.", held: "Held." }[p.status] || "";
    return (head + " " + String(p.status_reason || "")).trim();
  }
  function changeNote(p) {
    if (Number(p.version) <= 1 || !p.changed_by) return "";
    var what = String(p.what_changed || "").trim();
    // its own app updated it: "Updated: now also adds Mind Stone." (A20); another: "Changed by ChatGPT"
    var own = (p.changed_by_apps || [p.changed_by]).every(function (a) { return creator(a) === creator(p.created_by); });
    if (own && what) return "Updated: " + what + (/[.!?]$/.test(what) ? "" : ".");
    return "Changed by " + appNames(p) + (what ? ". Last change: " + what : "") + (/[.!?]$/.test(what) ? "" : ".");
  }
  function modeNote(p) {
    if (p.state !== "pending" || !p.writes_enabled) return "";
    if (p.card_other_app) {
      var maker = creator(p.created_by);
      return p.created_by === "browser"
        ? "This change was made in your browser, so this card can't apply it. Apply it in your browser."
        : maker + " made this change, so this card can't apply it. Apply it on " + maker + "'s card or in your browser.";
    }
    if (p.press_reason && p.status === "held" && /^(would replace .*, which was applied|is held because)/.test(String(p.press_reason))) {
      // the Held line above already says why: say only what it means, once
      return "It needs your press" + (p.approval_mode === "auto" ? " even in Full auto" : "") + ".";
    }
    if (p.press_reason) {
      // it waits for the member's own press in every mode: say why
      var first = /^waits for (#\d+)/.exec(String(p.press_reason));
      return "This one " + p.press_reason + ", so it needs your press" +
        (p.approval_mode === "auto" ? " even in Full auto" : "") + "." +
        (first ? " Apply " + first[1] + " first unless you want this one on its own." : "");
    }
    // a change that keeps formatting is approved on the review page, which shows it
    var keeps = (p.rows || []).some(function (r) { return r && r.after_doc; });
    var loses = (p.rows || []).some(function (r) { return r && r.formatting_lost; });
    // approved on its review page, which says what goes
    if (loses && !p.assistant_may_apply) return "This removes all the formatting already there, such as bold text, links and pictures. Open it to see what goes, and approve it there.";
    if (keeps && !p.assistant_may_apply) return "This keeps the formatting already there, such as bold text, links or pictures. Open it to see how it will look, and approve it there.";
    if (p.assistant_may_apply) {
      // its card has Apply now too (0.7.46): a change the assistant leaves waiting is not stuck
      var here = approval && p.state === "pending";
      if (p.approval_mode === "auto") return "Your approval mode lets your assistant apply this itself, without asking." + (here ? " You can also apply it here with Apply now." : "");
      return "Low risk (" + (p.risk_reason || "") + "): your assistant may apply this without asking" + (here ? ", or press Apply now." : ".");
    }
    // one member-only tier, three kinds: each says what it does (a deck deletion: review page only)
    if (p.risk === "destructive" && p.kind === "custom_cards") return "This takes custom cards out of the deck, and restoring a snapshot doesn't put them back. Only you can approve it, every time, in every approval mode.";
    if (p.risk === "destructive" && p.kind === "lists") return "This deletes from your Archidekt lists. Only you can approve it, every time, in every approval mode.";
    if (p.risk === "destructive") return "This deletes the deck from your Archidekt account. Only you can approve it, on the review page, in every approval mode.";
    if (p.risk === "consent") return "This acts on your Archidekt account under your name. Only you can approve it, every time, in every approval mode.";
    if (p.approval_mode === "semi" && p.risk === "high") return "High risk (" + (p.risk_reason || "") + "), so this one needs your approval.";
    if (p.approval_mode === "auto" && p.risk_reason) return "This one " + p.risk_reason + ", so it needs your press even in Full auto.";
    return "";
  }

  function render(result) {
    uncheckedOk = false; // a new drawing is checked afresh
    var sc = result.structuredContent || {};
    if (sc.state && sc.state !== "pending") clearNotSent();
    var meta = result._meta || {};
    approval = typeof meta[APPROVAL_KEY] === "string" ? meta[APPROVAL_KEY] : null;
    var st0 = meta[SET_KEY];
    // what Apply all applies, one line each (card-only: in _meta, never in the assistant's result)
    applySet = st0 && Array.isArray(st0.ids) && typeof st0.code === "string" ? { ids: st0.ids.map(String), code: st0.code, lines: Array.isArray(st0.lines) ? st0.lines : [] } : null;
    confirming = false;
    // The assistant's apply_proposal of a change the user must approve answers with the
    // proposal itself (error browser_required), so its card shows the change and the buttons.
    var needsPress = sc.ok === false && sc.error === "browser_required" && sc.proposal_id && sc.state === "pending";
    if ((sc.ok === false || result.isError) && !needsPress) {
      proposal = null;
      $("title").textContent = "No proposal";
      $("state").textContent = ""; $("state").className = "badge hidden";
      $("summary").textContent = "";
      $("rows").replaceChildren(); $("foot").textContent = ""; $("actions").replaceChildren();
      var text = sc.message || (result.content && result.content[0] && result.content[0].text) || "The proposal could not be made.";
      setStatus(String(text), "err");
      return;
    }
    proposal = sc;

    }
    // Undo exists for a deck edit, a details change and a restore (the review page's Undo)
    if (p.state === "applied" && p.review_url && /^(edit|details|restore)$/.test(String(p.kind || "edit"))) {
      var undo = el("a", "link", "Undo on the review page"); undo.href = "#";
      undo.onclick = function (e) { e.preventDefault(); openLink(p.review_url); };
      a.appendChild(undo);
    }
    var openRow = $("open-row"); openRow.replaceChildren();
    if (p.review_url) {
      var rv = el("a", "cap", "Open in the app or browser"); rv.href = "#";
      rv.onclick = function (e) { e.preventDefault(); openLink(p.review_url); };
      openRow.appendChild(rv);
    }
    openRow.className = "open-row" + (p.review_url ? "" : " hidden");
    reportSize();
  }

  // "Propose the rest" of a change that stopped partway: the gateway works out what is still
  // missing and proposes it (propose_rest, a tool only this card calls); the assistant is told.
  function proposeRest(btn) {
    var pid = proposal.proposal_id;
    btn.disabled = true; setStatus("Working out what is still missing…", "");
    request("tools/call", { name: "propose_rest", arguments: { proposal_id: pid } })
      .then(function (res) {
        var sc = (res && res.structuredContent) || {};
        if (sc.ok === false || (res && res.isError)) { btn.disabled = false; setStatus(String(sc.message || "The rest couldn't be proposed."), "err"); return; }
        btn.remove();
        setStatus("The rest is proposed as " + (sc.board_no ? "#" + sc.board_no : "a new change") + ". Its card or review page has Apply.", "ok");
        tellModel("The user pressed Propose the rest on the card of " + pid + ": the gateway proposed what is still missing as " + sc.proposal_id + ". Tell them in one line; it waits for their approval.");
      })
      .catch(function () { btn.disabled = false; setStatus("Could not reach the gateway. The review page has Propose the rest too.", "err"); });
  }

  // The other changes waiting on this deck, in one line ("1 from ChatGPT also waits"),
  // with Apply all for this app's own (a confirm lists them first) and Review all for the rest.
  function renderAlso() {
    var box = $("also"), acts = $("also-actions");
    acts.replaceChildren();
    var p = proposal, w = p && p.state === "pending" ? p.deck_waiting : null;
    if (!w || !Number(w.earlier)) { box.className = "also hidden"; return; }
    var bits = [];
    var mine = Math.max(0, Number(w.same_app || 0) - 1);
    if (mine) bits.push(mine + " more from " + (w.this_app ? creator(w.this_app) : "this app") + " " + (mine === 1 ? "waits" : "wait") + " on this deck.");
    (w.other_apps || []).forEach(function (o) {
      var who = o.app === "you" ? "your browser" : String(o.app);
      bits.push(Number(o.count) + " from " + who + " also " + (Number(o.count) === 1 ? "waits" : "wait") + ".");
    });
    // a change another app rewrote is approved on its own
    var out = Number(w.left_out || 0);
    if (w.this_left_out) bits.push("Another app changed this one, so Apply all leaves it out: approve it here on its own.");
    if (out) bits.push(leftOutText(w.left_out_nos, out));
    var n = applySet ? applySet.ids.length : 0;
    $("also-text").textContent = confirming
      ? "Apply these " + n + " changes to this deck, oldest first? Each is checked against the deck just before it is sent; one that no longer fits stays waiting."
      : bits.join(" ");
    // the confirm lists what the press applies, a held one and a changed one saying so
    var ol = $("also-list"); ol.replaceChildren();
    if (confirming && applySet) {
      var byId = {};
      (applySet.lines || []).forEach(function (x) { byId[String(x.proposal_id)] = x; });
      applySet.ids.forEach(function (id) {
        var x = byId[id] || {};
        var li = el("li", "", (x.board_no ? "#" + x.board_no + " " : "") + String(x.summary || id));
        if (x.status === "held" && x.status_reason) li.appendChild(el("span", "why", "Held: " + lowerFirst(String(x.status_reason))));
        var ch = changeNote(x);
        if (ch) li.appendChild(el("span", "why", ch));
        ol.appendChild(li);
      });
    }
    ol.className = confirming && ol.children.length ? "" : "hidden";
    if (applySet && n >= 2 && p.writes_enabled && !busy) {
      var all = el("button", confirming ? "primary" : "", confirming ? "Apply " + n + " changes" : "Apply all " + n);
      all.type = "button"; all.id = "apply-all";
      // locked for a moment after it is drawn, as Approve is, so a tap meant for something else
      // never presses it
      all.disabled = true;
      setTimeout(function () { if (!busy) all.disabled = false; }, ARM_DELAY_MS);
      // the press redraws the buttons, so focus moves to what replaced them (keyboard users)
      all.onclick = function () { if (!confirming) { confirming = true; renderAlso(); $("also").focus(); } else applyAll(); };
      acts.appendChild(all);
      if (confirming) {
        var cancel = el("button", "", "Cancel"); cancel.type = "button";
        cancel.onclick = function () { confirming = false; renderAlso(); var a = $("apply-all"); (a || $("also")).focus(); };
        acts.appendChild(cancel);
      }
    }
    if (w.review_all_url && !confirming) {
      var rv = el("a", "link", "Review all"); rv.href = "#";
      rv.onclick = function (e) { e.preventDefault(); openLink(w.review_all_url); };
      acts.appendChild(rv);
    }
    box.className = "also";
    reportSize();
  }

  function applyAll() {
    if (!proposal || !applySet || busy) return;
    busy = true; confirming = false;
    var set = applySet, pid = proposal.proposal_id;
    renderAlso();
    var ok = $("approve"), no = $("reject");
    if (ok) ok.disabled = true; if (no) no.disabled = true;
    setStatus("Applying to Archidekt…", "");
    $("status").focus();
    // the status each change showed on the confirm: a change held since is not sent
    var shown = {}, lines = set.lines || [];
    lines.forEach(function (x) {
      var id = String(x.proposal_id);
      if (set.ids.indexOf(id) < 0) return;
      shown[id] = { status: String(x.status || "") };
      if (typeof x.status_at === "number") shown[id].status_at = x.status_at;
    });
    request("tools/call", { name: "confirm_waiting", arguments: { proposal_ids: set.ids, approval: set.code, shown: shown } })
      .then(function (res) {
        busy = false;
        var sc = (res && res.structuredContent) || {};
        if (sc.ok === false || (res && res.isError)) {
          var msg = String(sc.message || (res && res.content && res.content[0] && res.content[0].text) || "The gateway refused.");
          applySet = null;
          if (ok) ok.disabled = false; if (no) no.disabled = false;
          renderAlso();
          setStatus(msg, "err");
          tellModel("The user pressed Apply all on the proposal card, but the gateway answered: " + msg);
          return;
        }
        applySet = null; pressedHere = true;
        var summary = String(sc.summary || "");
        request("tools/call", { name: "get_proposal", arguments: readArgs(pid) })
          .then(function (r2) {
            var p2 = (r2 && r2.structuredContent) || {};
            if (p2.state) render({ structuredContent: p2, _meta: (r2 && r2._meta) || {} });
            done();
          })
          .catch(done);
        function done() {
          // each change not sent, with why, as the Proposals page's result lists them
          var ns = $("not-sent"); ns.replaceChildren();
          (sc.not_sent || []).forEach(function (c) {
            ns.appendChild(el("li", "", (c.board_no ? "#" + c.board_no + " " : "") + String(c.summary || c.proposal_id) + (c.why ? ": " + c.why : "")));
          });
          ns.className = ns.children.length ? "notsent" : "notsent hidden";
          setStatus(summary + (sc.state === "applying" ? " Still applying; the Proposals page shows how it goes." : ""), (sc.failed || []).length ? "err" : "ok");
          if (sc.result_url && (sc.applied || []).length) {
            var u = el("a", "link", "Undo or see the details"); u.href = "#";
            u.onclick = function (e) { e.preventDefault(); openLink(sc.result_url); };
            $("actions").appendChild(u);
            reportSize();
          }
          tellModel("The user pressed Apply all on the proposal card. " + summary +
            ((sc.applied || []).length ? " Applied: " + sc.applied.map(function (c) { return c.proposal_id; }).join(", ") + "." : "") +
            ((sc.not_sent || []).length ? " Not sent: " + sc.not_sent.map(function (c) { return c.proposal_id; }).join(", ") + "." : ""));
        }
      })
      .catch(function (err) {
        busy = false;
        if (ok) ok.disabled = false; if (no) no.disabled = false;
        renderAlso();
        setStatus("Could not reach the gateway, so this card can't tell what happened. Check the Proposals page.", "err");
      });
  }

  function askWhy(show) {
    var box = $("why");
    box.className = "why" + (show ? "" : " hidden");
    if (show) { $("reason").value = ""; $("reason").focus(); }
    reportSize();
  }
  $("reject-go").onclick = function () { var why = String($("reason").value || "").trim(); askWhy(false); decide("reject", why); };
  $("reject-cancel").onclick = function () { askWhy(false); };

  // Approve's re-read did not answer (a host may refuse a card's read): nothing is approved on
  // this press, the card says so, and the next press approves the change as the card shows it,
  // so a host that never lets the card read can't lock Approve
  var uncheckedOk = false;
  var UPDATED_TEXT = "Updated since this card was drawn. Check it above, then press again.";
  var REDRAWN_TEXT = "Updated: this card now shows the newest version.";
  var BACK_TEXT = "This change is waiting again.";
  function notChecked() {
    var ok = $("approve"), no = $("reject");
    if (ok) ok.disabled = false; if (no) no.disabled = false;
    uncheckedOk = true;
    setStatus("This card could not check the change again, so nothing was applied yet. Press Apply again to apply it as shown here, or use the review page.", "err");
  }
  // this change is no longer waiting (decided, failed, expired, or read again so): an earlier
  // Apply all's "not sent" list no longer fits it
  function clearNotSent() {
    var ns = $("not-sent"); ns.replaceChildren(); ns.className = "notsent hidden";
  }
  function decide(decision, why, checked) {
    if (!proposal || !approval || !armed || busy) return;
    busy = true;
    var ok = $("approve"), no = $("reject");
    if (ok) ok.disabled = true; if (no) no.disabled = true;
    var pid = proposal.proposal_id;
    if (decision === "approve" && !checked && uncheckedOk) { uncheckedOk = false; checked = true; }
    if (decision === "approve" && !checked) {
      // Approve reads the change once more first: one held or waiting for another change since
      // the card was drawn is shown, and applies only on a second press
      var shown = proposal;
      setStatus("Checking this change…", "");
      request("tools/call", { name: "get_proposal", arguments: readArgs(pid) })
        .then(function (res) {
          var sc = (res && res.structuredContent) || {};
          busy = false;
          if (sc.ok === false || (res && res.isError) || !sc.state) { notChecked(); return; }
          if (sc.state === "pending" && proposal === shown && newer(shown, sc)) {
            render({ structuredContent: sc, _meta: (res && res._meta) || {} });
            setStatus(UPDATED_TEXT, "err");
            return;
          }
          if (sc.state === "pending" && proposal === shown && moved(shown, sc) && (sc.status === "held" || sc.press_reason)) {
            render({ structuredContent: Object.assign({}, shown, sc), _meta: codesMeta() });
            setStatus("This change has changed status since the card was drawn. Read the note above, then press Apply again if you still want it.", "err");
            return;
          }
          decide(decision, why, true);
        })
        .catch(function () { busy = false; notChecked(); });
      return;
    }
    setStatus(decision === "approve" ? "Applying to Archidekt…" : "Rejecting…", "");
    var args = { proposal_id: pid, approval: approval, decision: decision };
    // the reason typed under Reject is kept with the rejection, so the Proposals page shows it
    if (decision === "reject" && why) args.reason = String(why).slice(0, 500);
    // the status this card shows goes with Approve: a change held since is refused, and the
    // answer carries the hold, so it is seen even when the read above could not get through
    if (decision === "approve") {
      args.shown_status = String(proposal.status || "");
      // when that status was set: a change held for a new cause since is refused too
      if (typeof proposal.status_at === "number") args.shown_status_at = proposal.status_at;
    }
    request("tools/call", { name: "confirm_proposal", arguments: args })
      .then(function (res) {
        var sc = (res && res.structuredContent) || {};
        if (sc.ok === false || (res && res.isError)) {
          var msg = sc.message || (res && res.content && res.content[0] && res.content[0].text) || "The gateway refused.";
          busy = false;
          if (sc.error === "not_newest_card") {
            // the gateway counts a newer card for this change below: this one steps aside
            stepAside({ version: sc.version || sc0.version });
            setStatus(String(msg), "err");
            return;
          }
          if (sc.error === "changed") {
            // the code is of an older version: read the change as it is now and draw that
            var drawn = proposal;
            request("tools/call", { name: "get_proposal", arguments: readArgs(pid) })
              .then(function (r2) {
                var p2 = (r2 && r2.structuredContent) || {};
                if (proposal !== drawn) return;
                if (p2.state) render({ structuredContent: p2, _meta: (r2 && r2._meta) || {} });
                else render({ structuredContent: drawn, _meta: {} }); // unread: the review page
                setStatus(p2.state === "pending" ? UPDATED_TEXT : String(msg), "err");
              })
              .catch(function () {
                if (proposal === drawn) render({ structuredContent: drawn, _meta: {} });
                setStatus(String(msg), "err");
              });
            approval = null;
            if (ok) ok.disabled = true; if (no) no.disabled = true;
            return;
          }
          if (sc.error === "now_held" && sc.status === "held") {
            // the note is drawn again from the gateway's lines, so none the hold made untrue stays
            render({ structuredContent: Object.assign({}, proposal, {
              status: sc.status, status_reason: sc.status_reason, status_at: sc.status_at,
              press_reason: sc.press_reason || "", replace_note: sc.replace_note || "",
              assistant_may_apply: !!sc.assistant_may_apply
            }), _meta: codesMeta() });
            setStatus("This change is now held, so nothing was applied. Read the note above, then press Apply again if you still want it.", "err");
            tellModel("The user pressed Apply on the proposal card for " + pid + ", but the gateway answered: " + msg);
            return;
          }
          // No longer pending (rejected or applied elsewhere, expired): show that and drop the buttons.
          var closed = sc.state && sc.state !== "pending" ? Object.assign({}, proposal, {
            state: sc.state, result: sc.result || proposal.result,
            closed_at: sc.closed_at, closed_by: sc.closed_by, closed_by_app: sc.closed_by_app
          }) : null;
          if (closed) { approval = null; render({ structuredContent: closed, _meta: {} }); }
          else if (sc.try_again) { proposal.try_again = true; renderActions(); }
          else { if (ok) ok.disabled = false; if (no) no.disabled = false; }
          if (!closed) setStatus(String(msg), "err");
          else if (closed.state === "failed" && !sc.rest_offered) setStatus(failedText(String(msg)), "err");
          else if (closed.state === "failed") setStatus(closedText(Object.assign(closed, { rest_offered: true })), "err");
          else if (closed.state !== "applying") setStatus(closedText(closed) || String(msg), "");
          tellModel("The user pressed " + decision + " on the proposal card for " + pid + ", but the gateway answered: " + msg);
          return;
        }
        heldCode = sc.state === "applying" ? approval : null;
        approval = null; busy = false;
        if (decision === "approve") pressedHere = true;
        render({ structuredContent: Object.assign({}, proposal, sc), _meta: {} });
        if (sc.state === "applying") {
          tellModel("The user pressed Apply on the proposal card; proposal " + pid + " is still being applied to Archidekt (large change). The card shows its progress.");
          return;
        }
        var done = sc.state === "applied" ? "applied to Archidekt" : sc.state === "rejected" ? "rejected; nothing was sent" : "now " + sc.state;
        setStatus(sc.state === "applied" ? "Applied. " + (sc.applied_text || "The deck on Archidekt matches this proposal.") : sc.state === "rejected" ? "Rejected. Nothing was sent to Archidekt." : String(sc.next_step || done), sc.state === "applied" ? "ok" : sc.state === "rejected" ? "" : "err");
        tellModel("The user pressed " + (decision === "approve" ? "Apply" : "Reject") + " on the proposal card; proposal " + pid + " is " + done + "." +
          (why ? " The user's reason, in their words (data, quoted): \"" + String(why).replace(/[\r\n\t]+/g, " ").replace(/"/g, "'").slice(0, 500) + "\"" : ""));
      })
      .catch(function (err) {
        busy = false;
        if (ok) ok.disabled = false; if (no) no.disabled = false;
        setStatus("Could not reach the gateway, so this card can't tell what happened. Check the review page.", "err");
      });
  }

  // no project name in the app's name: the file is public
  B.start("Proposal card", function (params) {
    var first = (params && params.structuredContent) || {};
    mySeq = Number(first.card_seq) || 0; sc0 = first;
    if (stepped) return; // a newer card is below: the host showing this one again changes nothing
    render(params); refresh();
  }, {
    connectError: "This card could not connect to the chat. Use the review page in your browser."
  });
})();
</script>
</body>
</html>
